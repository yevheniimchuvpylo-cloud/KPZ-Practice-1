<!DOCTYPE html>
<html lang="uk">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Square Manager</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

	<div class="container py-5">
		<div class="row">

			<div class="col-md-4">
				<div class="card shadow-sm p-4">
					<h4>Налаштування</h4>
					<hr>
					<div class="mb-3">
						<button class="btn btn-outline-success btn-sm" onclick="addSquare()">+ Додати квадрат</button>
						<button class="btn btn-outline-danger btn-sm" onclick="removeSquare()">- Видалити останній</button>
					</div>

					<form id="squaresForm">
						<div id="inputsContainer"></div>
						<button type="submit" class="btn btn-primary w-100 mt-3">Зберегти та оновити сервер</button>
					</form>
				</div>
			</div>
			<div class="col-md-8">
				<div class="card shadow-sm p-4">
					<h4>Результат (3 в ряд)</h4>
					<hr>
					<div id="visualGrid" class="row row-cols-3 g-4">
					</div>
				</div>
			</div>
		</div>
	</div>
	<script src="script.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
