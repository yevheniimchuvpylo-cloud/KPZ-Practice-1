name: CI to Docker Hub

on:
  push:
    branches: [ "devops", "main" ] # Робот спрацює на пуш в обидві гілки

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # ЗАМІНИ 'nazariivd' на свій логін Docker Hub, якщо він інший
          tags: nazariivd/lost-backend:latest
